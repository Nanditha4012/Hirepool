<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A66C2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Vite substitutes %VITE_APP_NAME% at build/serve time from the env file,
         so the product name is never hardcoded in markup. App.tsx also sets
         document.title from the same value at runtime. -->
    <title>%VITE_APP_NAME%</title>
    <meta
      name="description"
      content="%VITE_APP_NAME% — a reverse job board. Get verified once, let companies find and unlock you."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- vite-plugin-pwa injects <link rel="manifest"> automatically at build time -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
